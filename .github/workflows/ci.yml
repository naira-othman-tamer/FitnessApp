name: CI

on:
  push:
    branches:
      - Dev
      - main
      - master
  pull_request:
    branches:
      - Dev
      - main
      - master

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FitnessApp.slnx

      - name: Build
        run: dotnet build FitnessApp.slnx --configuration Release --no-restore

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f docker-compose.yml config

      - name: Build Compose Images
        run: docker compose -f docker-compose.yml build
