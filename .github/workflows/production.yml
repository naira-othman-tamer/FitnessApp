name: Production Build & Push

on:
  push:
    branches:
      - Dev
      - master
      - main

concurrency:
  group: docker-build-production
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: wirosol793
  DOCKER_REPO: elevateprojects
  PROJECT_NAME: api-fitness-app

jobs:
  generate-tag:
    name: Generate Timestamp
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.timestamp.outputs.tag }}
    steps:
      - name: Generate timestamp for tagging
        id: timestamp
        run: |
          export TZ=Africa/Cairo
          echo "tag=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    needs: generate-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: ./FitnessApp/Dockerfile
          - service: auth
            dockerfile: ./AuthenticationService/Dockerfile
          - service: profile
            dockerfile: ./ProfileService/Dockerfile
          - service: nutrition
            dockerfile: ./NutritionService/Dockerfile
          - service: workout
            dockerfile: ./WorkoutService/Dockerfile
          - service: progress
            dockerfile: ./ProgressTrackingService/Dockerfile
          - service: fce
            dockerfile: ./FCE/Dockerfile
          - service: notification
            dockerfile: ./NotificationService/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-${{ matrix.service }}-${{ needs.generate-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-${{ matrix.service }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  summary:
    name: Deployment Summary
    needs:
      - generate-tag
      - build-and-push
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Output image tags
        run: |
          echo "## Deployment Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Hub Repository" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Timestamp Tag" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.generate-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tag Format" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.PROJECT_NAME }}-{service}-${{ needs.generate-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.PROJECT_NAME }}-{service}-latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-gateway-${{ needs.generate-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-auth-${{ needs.generate-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-profile-${{ needs.generate-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-nutrition-${{ needs.generate-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-workout-${{ needs.generate-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-progress-${{ needs.generate-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-fce-${{ needs.generate-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.PROJECT_NAME }}-notification-${{ needs.generate-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
